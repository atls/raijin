name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/master' && vars.RAIJIN_RELEASE_ENABLED == 'true' }}
    uses: atls/shared/.github/workflows/publish-semantic.yaml@master
    permissions:
      contents: write
      packages: write

    with:
      packageName: '@atls/raijin'
      clientId: ${{ vars.ATLANTIS_SUPER_BOT_CLIENT_ID }}
      prepareCommand: yarn cli:build
      githubPackages: true
      assetPath: .yarn/releases/yarn.js
      assetName: yarn.js
    secrets:
      appPrivateKey: ${{ secrets.ATLANTIS_SUPER_BOT_PRIVATE_KEY }}
      npmAuthToken: ${{ secrets.NPM_TOKEN }}
