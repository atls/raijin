name: Checks

on:
  pull_request:
    paths-ignore:
      - '.github/**'

jobs:
  checks:
    name: Shared checks / Checks
    env:
      NODE_VERSION: '25'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        uses: ./.github/actions/install

      - name: Checks
        uses: ./.github/actions/checks
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED: 'true'

  raijin:
    name: Raijin checks
    env:
      NODE_VERSION: '25'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: read-all

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        uses: ./.github/actions/install

      - name: Raijin checks
        shell: bash
        run: |
          yarn raijin:check

  windows-invocation:
    name: Windows invocation
    env:
      NODE_VERSION: '25'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: read-all

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        uses: ./.github/actions/install

      - name: Test Windows invocation
        shell: bash
        run: |
          test_runtime=(yarn node --loader ./yarn/raijin/src/runtime/typescript-loader.ts --enable-source-maps --test)
          "${test_runtime[@]}" --test-name-pattern="should execute nested Yarn through the Windows command shim" yarn/raijin/src/commands/invocation/resolve.test.ts
          "${test_runtime[@]}" --test-name-pattern="should execute Windows command wrappers without a shell option" yarn/raijin/src/commands/invocation/adapters/child-process.test.ts
