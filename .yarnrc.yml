approvedGitRepositories:
  # TODO: remove the builder fork once upstream @yarnpkg/builder supports ESM
  # bundle output and external files.
  # Tracking: https://github.com/yarnpkg/berry/issues/7200
  - 'https://github.com/TorinAsakura/yarnpkg-builder'
  - 'https://github.com/TorinAsakura/yarnpkg-builder.git'

compressionLevel: mixed

defaultSemverRangePrefix: ''

enableGlobalCache: true

globalFolder: ../.yarn/berry

packageExtensions:
  '@actions/github@*':
    dependencies:
      undici: '*'
  '@babel/core@*':
    dependencies:
      '@babel/preset-typescript': 7.29.7
  '@next/eslint-plugin-next@*':
    dependencies:
      eslint: '*'
  '@octokit/plugin-paginate-rest@*':
    dependencies:
      '@octokit/core': '*'
  '@typescript-eslint/utils@*':
    dependencies:
      eslint: '*'
  '@yarnpkg/core@*':
    dependencies:
      '@types/lodash': '*'
  '@yarnpkg/plugin-git@*':
    dependencies:
      '@yarnpkg/libzip': '*'
  '@yarnpkg/plugin-npm-cli@*':
    dependencies:
      '@yarnpkg/cli': '*'
      '@yarnpkg/plugin-npm': '*'
      '@yarnpkg/plugin-pack': '*'
  '@yarnpkg/plugin-npm@*':
    dependencies:
      '@yarnpkg/plugin-pack': '*'
  '@yarnpkg/plugin-pack@*':
    dependencies:
      '@yarnpkg/cli': '*'
  '@yarnpkg/plugin-pnp@*':
    dependencies:
      '@yarnpkg/cli': '*'
  '@yarnpkg/plugin-stage@*':
    dependencies:
      '@yarnpkg/cli': '*'
  eslint-plugin-n@*:
    dependencies:
      typescript: 5.9.3
  eslint-plugin-react-hooks@*:
    dependencies:
      '@types/estree': '*'
  eslint@*:
    dependencies:
      jiti: 1.21.6
  git-raw-commits@*:
    dependencies:
      conventional-commits-filter: ^5.0.0
      conventional-commits-parser: ^6.4.0
  import-sort-parser-typescript@*:
    dependencies:
      import-sort-parser: '*'
  import-sort-style@*:
    dependencies:
      import-sort-parser: '*'
  ink-link@*:
    dependencies:
      '@types/react': 18.3.31
      react: '*'
  'ink@3.2.0':
    dependencies:
      '@types/react': 17.0.93
      '@types/react-reconciler': '*'
      '@types/yoga-layout': '*'
      react: '*'
  'ink@5.2.1':
    dependencies:
      '@types/react': 18.3.31
      '@types/react-reconciler': '*'
      react: '*'
      react-devtools-core: 4.28.5
  webpack@*:
    dependencies:
      json-schema: '*'

pnpEnableEsmLoader: true

preferReuse: true

yarnPath: .yarn/releases/yarn.js
